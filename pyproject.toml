[project]
name = "ercot-grid-forecaster"
version = "0.1.0"
description = "ML system for forecasting ERCOT electricity spot prices using weather, supply-side, and public sentiment signals."
requires-python = ">=3.9"
dependencies = [
    # Core data
    "pandas",
    "numpy",
    "pyarrow",
    # APIs
    "requests",
    "gridstatus",
    # ML
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "statsmodels",
    "scipy",
    "pyyaml",
    # Visualization
    "matplotlib",
    "seaborn",
    "plotly",
    # Dashboard
    "streamlit",
    # Utilities
    "xlrd",
    "python-dotenv",
    "tqdm",
    "schedule",
    # Testing
    "pytest",
    # Notebooks
    "jupyterlab",
]

[project.optional-dependencies]
# Heavy / model-specific dependencies, kept out of the base install so a clone
# stays quick to set up. Install only the family you intend to run.
trees = ["catboost", "ngboost"]
deep = ["torch", "pytorch-forecasting", "pytorch-lightning"]
foundation = ["chronos-forecasting", "transformers", "accelerate"]
classical = ["prophet", "pmdarima"]
all = [
    "catboost", "ngboost",
    "torch", "pytorch-forecasting", "pytorch-lightning",
    "chronos-forecasting", "transformers", "accelerate",
    "prophet", "pmdarima",
]

[tool.setuptools]
packages = ["pipelines", "utils", "models", "evaluation", "dashboard",
            "src", "src.data", "src.features", "src.models", "src.evaluation"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"
